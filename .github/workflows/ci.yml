name: CI

# 커밋 훅은 이 클론에만 걸려 있다. PR 로 들어오는 변경은 여기서 같은 검사를 받는다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc -b

      - name: Lint
        run: bunx biome check .

      # 계약 테스트는 자체 브로커를 띄운다. 외부 서비스나 도커가 필요 없다.
      - name: Test
        run: bun test

      # 소비자가 실제로 받는 산출물이 만들어지는지까지 본다.
      - name: Build library
        run: bun run build:lib

      # 진입점 설정이 틀리면 설치한 쪽에서만 깨진다. 여기서 잡는다.
      - name: Check package entry points
        run: bun run check:dist
